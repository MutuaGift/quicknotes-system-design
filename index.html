<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes</h1>
    <p class="tagline">Notes over the network, using the Fetch API</p>
  </header>

  <main>
    <section>
      <h2>Add a note</h2>

      <!-- novalidate: the browser's own bubbles are turned off
           because the checks and messages live in api.js, so
           every browser behaves the same way -->
      <form id="note-form" novalidate>
        <div class="field">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" autocomplete="off" placeholder="e.g. Pack for Monday">
          <p class="field-error" id="title-error" role="alert"></p>
          <p class="hint">Required, up to 100 characters. The body is optional.</p>
        </div>

        <div class="field">
          <label for="body-input">Body</label>
          <textarea id="body-input" rows="4" placeholder="Optional"></textarea>
        </div>

        <button type="submit" id="submit-btn">Add note</button>
      </form>
    </section>

    <section>
      <h2>Your notes</h2>

      <button type="button" id="load-btn">Load notes</button>

      <p id="status" class="status">Press "Load notes" to begin.</p>

      <ul id="notes-list" class="notes"></ul>
    </section>
  </main>

  <footer>
    <p>Practising API calls against the JSONPlaceholder test API.</p>
  </footer>

</body>
</html>
