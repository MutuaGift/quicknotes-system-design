<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes</h1>
    <p class="tagline">Notes over the network, using the Fetch API</p>
  </header>

  <main>
    <section>
      <h2>Your notes</h2>

      <button type="button" id="load-btn">Load notes</button>

      <p id="status" class="status">Press &quot;Load notes&quot; to begin.</p>

      <ul id="notes-list" class="notes"></ul>
    </section>
  </main>

  <footer>
    <p>Practising API calls against the JSONPlaceholder test API.</p>
  </footer>

</body>
</html>
